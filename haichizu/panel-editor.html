<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配電盤エディタ</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #334155; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ?solo=<winId> で指定した FloatWin だけをフルスクリーン表示するモード
window.SOLO_WIN = new URLSearchParams(location.search).get('solo') || '';

(async () => {
  const srcFiles = [
    'solidModel.js',
    'src/FloatWin.jsx',
    'src/panel/panelGeometry.js',
    'src/panel/panelChambers.js',
    'src/panel/panelSolid.js',
    'src/panel/panelStore.js',
    'src/panel/panelDrawCore.js',
    'src/panel/PanelCanvas3D.jsx',
    'src/panel/PanelEditor.jsx',
    'src/panel/PanelTreePanel.jsx',
    'src/panel/PanelPropPanel.jsx',
    'src/panel/PanelSliceViews.jsx',
    'src/panel/PanelWirePortLayer.jsx',
    'src/panel/panelAutoLayout.js',
    'src/panel/PanelApp.jsx',
  ];

  try {
    const ts = Date.now();
    let combined = `const { useState, useRef, useCallback, useEffect, useMemo, useLayoutEffect } = React;\n`;
    // solidModel.js は末尾で INIT_BUILDINGS を参照する（配置図用）→ 空配列でスタブ
    combined += `const INIT_BUILDINGS = [];\n`;

    for (const f of srcFiles) {
      const res = await fetch(f + '?t=' + ts);
      if (!res.ok) throw new Error(`Failed to load ${f}: ${res.status}`);
      let code = await res.text();
      // react import を削除（グローバルから使うため）
      code = code.replace(/^import\s+\{[^}]+\}\s+from\s+["']react["'];?\s*\n?/gm, '');
      // ES module export を削除（evalコンテキストではSyntaxError）
      code = code.replace(/^export\s+(function|const|class|let|var)\s+/gm, '$1 ');
      combined += `\n// ===== ${f} =====\n` + code + '\n';
    }

    // export default function PanelApp() → window.PanelApp = function PanelApp()
    combined = combined.replace(
      /export\s+default\s+function\s+PanelApp\s*\(\)/,
      'window.PanelApp = function PanelApp()'
    );

    const result = Babel.transform(combined, {
      presets: [['react', { runtime: 'classic' }]],
      filename: 'panel-app.jsx',
    });

    eval(result.code);

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(window.PanelApp));
  } catch (e) {
    document.body.innerHTML =
      '<div style="color:#FFF;padding:20px;font-size:14px;">'
      + '<h2>読み込みエラー</h2>'
      + '<p style="margin-top:8px;font-family:monospace;background:#1E293B;padding:12px;border-radius:6px;">' + e.message + '</p>'
      + '<p style="margin-top:10px;color:#94A3B8">node server.js で起動してください</p>'
      + '</div>';
    console.error(e);
  }
})();
</script>
</body>
</html>
